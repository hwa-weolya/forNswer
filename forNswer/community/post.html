<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11111a">
    <meta name="description" content="NSWER 커뮤니티 게시글과 댓글을 확인합니다.">
    <title>게시글 — NSWER ZONE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script src="../assets/js/storage.js" defer></script>
    <script src="../assets/js/member-data.js" defer></script>
    <script src="../assets/js/community-data.js" defer></script>
    <script src="../assets/js/auth.js" defer></script>
    <script src="../assets/js/community-post.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../index.html" aria-label="NSWER ZONE 홈">
        <span class="brand-mark">N<span>✳</span></span>
        <span>NSWER <span class="brand-light">ZONE</span></span>
      </a>
      <nav class="main-nav" aria-label="주요 메뉴">
        <a href="../index.html#official">공식 링크</a>
        <a href="../index.html#schedule" aria-label="스케줄"><span class="nav-label">스케줄</span><svg class="mobile-nav-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="15" rx="2"></rect><path d="M7.5 3.5v4m9-4v4m-13 3h17"></path></svg></a>
        <a href="index.html" aria-label="커뮤니티"><span class="nav-label">커뮤니티</span><svg class="mobile-nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H7l-3.5 2v-5A7.5 7.5 0 1 1 20 11.5Z"></path></svg></a>
      </nav>
      <a class="header-cta" href="index.html">커뮤니티로 <span aria-hidden="true">↗</span></a>
      <div class="account-control">
        <button class="header-auth" id="auth-open" type="button">로그인</button>
        <div class="account-session" id="account-session" hidden>
          <span id="account-nickname"></span>
          <span class="role-badge" id="account-role-badge" hidden>ADMIN</span>
          <button class="logout-button" id="logout-button" type="button">로그아웃</button>
        </div>
      </div>
    </header>

    <main>
      <section class="section community-page post-page">
        <a class="text-link post-back-link" href="index.html"><span aria-hidden="true">←</span> 커뮤니티 목록</a>
        <article class="post-detail-card" id="post-detail" aria-live="polite"></article>
        <section class="comments-section" id="comments" aria-labelledby="comments-title">
          <div class="comments-heading">
            <div>
              <span class="section-kicker">NSWER TALK</span>
              <h2 id="comments-title">댓글 <span id="comments-count">0</span></h2>
            </div>
          </div>
          <p class="comments-disabled-note" id="comments-disabled-note" hidden>이 게시글은 댓글 작성이 비활성화되어 있습니다.</p>
          <form class="comment-form detail-comment-form" id="comment-form">
            <label for="comment-content">따뜻한 댓글을 남겨 주세요.</label>
            <div class="comment-compose">
              <textarea id="comment-content" name="content" rows="2" maxlength="300" required placeholder="서로를 존중하는 댓글 문화를 함께 만들어요."></textarea>
              <button class="button button-primary" type="submit" aria-label="댓글 등록" title="댓글 등록"><span class="comment-send-arrow" aria-hidden="true">↵</span></button>
            </div>
          </form>
          <div class="comment-list" id="comment-list"></div>
        </section>
      </section>
    </main>

    <footer class="site-footer">
      <a class="brand footer-brand" href="../index.html"><span class="brand-mark">N<span>✳</span></span><span>NSWER <span class="brand-light">ZONE</span></span></a>
      <p>팬이 함께 만드는 비공식 팬 커뮤니티입니다.<br>NMIXX 및 JYP Entertainment와 공식적으로 연관되어 있지 않습니다.</p>
      <a href="index.html" class="back-top">커뮤니티로 ↑</a>
    </footer>

    <dialog class="auth-modal" id="auth-modal" aria-labelledby="auth-title">
      <div class="auth-modal-content">
        <div class="auth-modal-heading">
          <div><span class="section-kicker">NSWER MEMBERS</span><h2 id="auth-title">로그인</h2></div>
          <button class="month-picker-close" id="auth-close" type="button" aria-label="닫기">×</button>
        </div>
        <p class="auth-notice">데모 회원 데이터로 동작합니다. 실제 계정이나 비밀번호를 입력하지 마세요.</p>
        <div class="auth-tabs" role="tablist" aria-label="로그인 또는 회원가입">
          <button class="auth-tab active" id="login-tab" type="button" role="tab" aria-selected="true">로그인</button>
          <button class="auth-tab" id="signup-tab" type="button" role="tab" aria-selected="false">회원가입</button>
        </div>
        <form class="auth-form" id="login-form">
          <label>이메일<input name="email" type="email" autocomplete="username" required placeholder="이메일"></label>
          <label>비밀번호<input name="password" type="password" autocomplete="current-password" required placeholder="비밀번호"></label>
          <div class="demo-accounts">
            <span>테스트 계정</span>
            <button type="button" data-demo-account="admin">관리자 계정 입력</button>
            <button type="button" data-demo-account="member">멤버 계정 입력</button>
          </div>
          <button class="button button-primary auth-submit" type="submit">로그인</button>
          <p class="auth-message" id="login-message" aria-live="polite"></p>
        </form>
        <form class="auth-form" id="signup-form" hidden>
          <label>닉네임<input name="nickname" autocomplete="nickname" required maxlength="20" placeholder="커뮤니티에서 사용할 닉네임"></label>
          <label>이메일<input name="email" type="email" autocomplete="email" required placeholder="이메일"></label>
          <label>비밀번호<input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="8자 이상"></label>
          <button class="button button-primary auth-submit" type="submit">가입하고 시작하기</button>
          <p class="auth-message" id="signup-message" aria-live="polite"></p>
        </form>
      </div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
